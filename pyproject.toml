[project]
name = "viewfinder"
version = "0.1.0"
description = "A media pane beside your AI coding agent. See what your agent sees."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["textual>=8.0", "textual-image>=0.13", "pillow>=10"]

[project.scripts]
vf = "viewfinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viewfinder"]
