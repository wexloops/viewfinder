[project]
name = "viewfinder"
version = "1.1.0"
description = "A media pane beside your AI coding agent. See what your agent sees."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Wexler", email = "david@strangeloop-studios.com" }]
keywords = ["claude-code", "codex", "terminal", "tui", "sixel", "kitty", "images", "video", "textual", "ai-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Viewers",
  "Topic :: Terminals",
]
dependencies = ["textual>=8.0", "textual-image>=0.13", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/wexloops/viewfinder"
Repository = "https://github.com/wexloops/viewfinder"
Issues = "https://github.com/wexloops/viewfinder/issues"

[project.scripts]
vf = "viewfinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viewfinder"]

[tool.hatch.build.targets.sdist]
include = ["src/viewfinder", "README.md", "LICENSE", "pyproject.toml"]
